<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ory</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='1.75'%3E%3Ccircle cx='12' cy='12' r='3'/%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/app.css" />
    <script>
      // Set the theme before first paint: the remembered choices, else Neutral
      // in the system's light or dark.
      (function () {
        var mode = null, palette = null;
        try {
          mode = localStorage.getItem("ory.theme");
          palette = localStorage.getItem("ory.palette");
        } catch (e) {}
        if (mode !== "light" && mode !== "dark") {
          mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = mode;
        document.documentElement.dataset.palette = palette === "dusk" ? "dusk" : "neutral";
      })();
    </script>
  </head>
  <body>
    <script type="module" src="/app.js"></script>
  </body>
</html>
